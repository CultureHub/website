    - generic [ref=f4e56]:
      - heading "About the Artists" [level=3] [ref=f4e58]
      - paragraph [ref=f4e61]: Walker Caplan is a writer and editor based in New York. Fiction forthcoming in n+1; plays supported by CultureHub, New York State Council on the Arts, New Relic Theatre, Signature Theatre (VA), Yale University, The Tank, and others; standup performed at Union Hall, The Bell House, Club Cumming, and elsewhere; recognized by YoungArts as an outstanding creative educator; co-editor-in-chief of Joyland Magazine.
      - paragraph [ref=f4e64]: Matt Romein is an artist and performer based in Brooklyn NY. His work consists of live performance, virtual production, generative computer art, and multi-media installation.
    - generic [ref=f4e65]:
      - heading "About the Program" [level=3] [ref=f4e67]
      - paragraph [ref=f4e69]: Castle Door was created during CultureHub's New Works program, an initiative that pairs writers with creative technologists to produce a work of experimental theater. Castle Door was made possible by the New York State Council on the Arts with the support of the Office of the Governor and the New York State Legislature.
