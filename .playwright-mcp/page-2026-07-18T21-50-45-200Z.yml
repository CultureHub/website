          - paragraph [ref=f4e50]: A narcissistic, idiosyncratic tutor teaches a homeschooled teenager creative writing over Zoom. When the student's short stories reveal an unusually repressed worldview, he starts to suspect something may be wrong. But is that real— or itself just a convenient fantasy?
          - paragraph [ref=f4e51]: Castle Door examines both the guaranteed failure and absolute freedom of saying something true.
        - link "Tickets" [ref=f4e53] [cursor=pointer]:
