    - generic [ref=f5e56]:
      - heading "Artworks on View" [level=3] [ref=f5e58]
      - generic [ref=f5e59]:
        - img "Fishin' for Average Caucasian Boyfriends" [ref=f5e60]
        - paragraph [ref=f5e62]:
          - strong [ref=f5e63]:
            - emphasis [ref=f5e64]: Fishin' for Average Caucasian Boyfriends
          - text: (2024) by Jackie Liu is a semi-autobiographical Game Boy game (playable on a real Game Boy device!) about expectations, queerness, and the possibility of dreaming bigger.Based on a true conversation the artist had with her mom at a seafood restaurant, the game allows players to make the choice to fish–or not...What if we refuse to play the game?
      - generic [ref=f5e65]:
        - img "Exit Sign image" [ref=f5e66]
        - paragraph [ref=f5e68]:
          - text: In
          - strong [ref=f5e69]:
            - emphasis [ref=f5e70]: Exit Sign<3
          - text: (2024) by Dahlia Bloomstone, the player walks through a long, damask and gold chandeliered hallway based on the one at the The Ritz-Carlton (a client favorite) and a text-fable unfolds as gold fishes clone and duplicate around her, follow her, and sometimes clone too much, causing her to fly into the starry sky and get stuck hanging there, but other times they enclose her in a hug, leading to a red 70% opacity sign filling the screen that reads “THE END, GOOD WORK AND LOVE HARD!,” which kills the player and puts her back at the beginning of the game again.
      - generic [ref=f5e71]:
        - img "Water Portals ASMR" [ref=f5e72]
        - paragraph [ref=f5e74]:
          - text: Inspired by the internet phenomenon of ASMR (Autonomous Sensory Meridian Response),
          - strong [ref=f5e75]:
            - emphasis [ref=f5e76]: Water Portals ASMR
          - text: (2025) by Rachel Stein is part of a series uncovers strangely satisfying moments through hypnotic sounds, textures, and visuals. Using visual effects, viewers are placed in a space between the real and imagined. The work encourages playful connections to our senses while blurring the line between the natural and synthetic.
      - generic [ref=f5e77]:
        - img "Abyss Embrace" [ref=f5e78]
        - paragraph [ref=f5e80]:
          - strong [ref=f5e81]:
            - emphasis [ref=f5e82]: Abyss Embrace
          - text: (2023) by Ella Barnes is a unique cyanotype on silk created with sunlight. This cameraless photo process yields Prussian blue impressions when exposed to UV light and is the origin for the term Blueprint. .
