    - generic [ref=f8e62]:
      - heading "About the Program" [level=3] [ref=f8e64]
      - paragraph [ref=f8e66]:
        - strong [ref=f8e67]: At this table…
        - text: is the culminating performance of the
        - strong [ref=f8e68]: Wellness Together Arts Fellowship
        - text: ", a partnership between Wellness Together and The Performance Project at University Settlement, CultureHub, and La MaMa. The fellowship is designed to leverage creative and interactive possibilities of online performance to create an expanded sense of community for homebound older adults and ensure the technological advances are accessible and inclusive to those who could benefit the most from it. The 2026 Wellness Together Arts Fellows Rita Liu and C Meranda Flachs-Surmanek collaborated with older adults and case managers/social workers in a series of workshops that centered community building and the generation of artistic material."
